name: gh-aw Version Check

# Daily read-only check that the compiled agentic workflow `.lock.yml` files are
# pinned to the versions every workflow tracks:
#
#   * all workflows  -> newest github/gh-aw release OR prerelease
#                       (baked into each lock as `compiler_version`)
#   * smoke-*.lock.yml only
#                    -> newest github/gh-aw-threat-detection release OR
#                       prerelease (the tag passed to
#                       `install_threat_detect_binary.sh` in the detection job)
#
# There is a single target per field: whichever release or prerelease was
# published most recently in the corresponding repo. Drafts and non-`v<digit>`
# tags are ignored.
#
# The detector tag is only policed on the smoke locks. Non-smoke locks (issue
# digest, parity monitor, stats, failure monitor, ...) follow whatever tag
# gh-aw's compiler bakes in via `constants.DefaultThreatDetectVersion`, which
# only moves on an upstream constant bump + drift-recompile. Policing their
# detector tag independently would produce spurious drift whenever a detector
# prerelease exists but the upstream constant has not yet been bumped.
#
# It does NOT build or compile anything. When drift is found it opens (or
# updates) a single tracking issue listing every workflow that needs updating
# and the target versions, and points at the `update-workflow-versions` skill.
# When everything is up to date, any open tracking issue is closed.
#
# Regenerating the locks is a separate, manual, human-reviewed step (see the
# update-workflow-versions skill) because pushing workflow-file changes needs a
# token with the `workflows` permission, which the built-in GITHUB_TOKEN lacks.

on:
  schedule:
    # Daily at 08:00 UTC.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-aw-version-check
  cancel-in-progress: false

jobs:
  check:
    # Never run on forks.
    if: ${{ github.repository == 'github/gh-aw-threat-detection' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_LABEL: workflow-version-drift
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check workflow versions
        id: check
        run: |
          set -euo pipefail

          GH_AW_REPO="github/gh-aw"
          DETECTOR_REPO="github/gh-aw-threat-detection"
          BODY="${RUNNER_TEMP}/version-drift.md"

          # newest_tag <repo>
          # Newest release tag by publish date whose name looks like a semantic
          # version (v<digit>...), counting prereleases, excluding drafts and
          # rolling refs. The repo has >100 releases, so paginate everything.
          newest_tag() {
            gh api "repos/$1/releases" --paginate \
              --jq '.[] | select(.draft == false) | select(.tag_name | test("^v[0-9]")) | [.published_at, .tag_name] | @tsv' \
              | sort | tail -n1 | cut -f2
          }

          gh_aw_latest="$(newest_tag "$GH_AW_REPO")"
          [ -n "$gh_aw_latest" ] && [ "$gh_aw_latest" != "null" ] || { echo "::error::could not resolve gh-aw latest version"; exit 1; }

          detector_latest="$(newest_tag "$DETECTOR_REPO")"
          [ -n "$detector_latest" ] && [ "$detector_latest" != "null" ] || { echo "::error::could not resolve threat-detect latest version"; exit 1; }

          echo "Target versions:"
          echo "  gh-aw       (latest release or prerelease): $gh_aw_latest"
          echo "  threat-detect (latest release or prerelease, smoke locks only): $detector_latest"
          echo

          # gh-aw compiler version baked into a lock file.
          lock_compiler_version() { grep -o '"compiler_version":"[^"]*"' "$1" | head -n1 | sed 's/.*:"//;s/"//'; }

          # Detector tag passed to install_threat_detect_binary.sh in a lock file.
          # Empty output means the lock does not invoke the installer.
          lock_detector_version() {
            grep -o 'install_threat_detect_binary\.sh" v[0-9][^"[:space:]]*' "$1" \
              | head -n1 | awk '{print $NF}'
          }

          drift_rows=""
          add_row() { drift_rows+="${1}"$'\t'"${2}"$'\t'"${3}"$'\t'"${4}"$'\n'; }

          shopt -s nullglob
          lock_files=(.github/workflows/*.lock.yml)
          shopt -u nullglob
          [ "${#lock_files[@]}" -gt 0 ] || { echo "::error::no *.lock.yml files found"; exit 1; }

          for lock in "${lock_files[@]}"; do
            base="$(basename "$lock" .lock.yml)"
            cur_ghaw="$(lock_compiler_version "$lock")"
            [ -n "$cur_ghaw" ] || { echo "::error::no compiler_version in $lock"; exit 1; }
            if [ "$cur_ghaw" != "$gh_aw_latest" ]; then
              add_row "$base" "gh-aw" "$cur_ghaw" "$gh_aw_latest"
              echo "DRIFT  $base gh-aw $cur_ghaw -> $gh_aw_latest"
            else
              echo "ok     $base gh-aw $cur_ghaw"
            fi

            # Detector tag is only policed on smoke locks.
            case "$base" in
              smoke-*-standalone)
                cur_det="$(lock_detector_version "$lock")"
                [ -n "$cur_det" ] || { echo "::error::no install_threat_detect_binary.sh invocation in $lock"; exit 1; }
                if [ "$cur_det" != "$detector_latest" ]; then
                  add_row "$base" "threat-detect" "$cur_det" "$detector_latest"
                  echo "DRIFT  $base threat-detect $cur_det -> $detector_latest"
                else
                  echo "ok     $base threat-detect $cur_det"
                fi
                ;;
            esac
          done

          echo
          if [ -z "$drift_rows" ]; then
            echo "All workflow versions are up to date."
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Version drift detected."
          echo "drift=true" >> "$GITHUB_OUTPUT"

          skill_url="https://github.com/${DETECTOR_REPO}/blob/main/skills/update-workflow-versions/SKILL.md"
          {
            echo "## Workflow version drift detected"
            echo
            echo "One or more compiled workflow \`.lock.yml\` files are pinned to an outdated version."
            echo
            echo "### Target versions"
            echo
            echo "| Field | Repo | Target |"
            echo "|-------|------|--------|"
            echo "| \`gh-aw\` (compiler, all locks) | \`${GH_AW_REPO}\` | \`${gh_aw_latest}\` |"
            echo "| \`threat-detect\` (smoke locks only) | \`${DETECTOR_REPO}\` | \`${detector_latest}\` |"
            echo
            echo "Both targets are the newest release **or prerelease** in their respective repo."
            echo
            echo "### Workflows needing an update"
            echo
            echo "| Workflow | Field | Current | Target |"
            echo "|----------|-------|---------|--------|"
            printf '%s' "$drift_rows" | while IFS=$'\t' read -r wf field cur tgt; do
              [ -n "$wf" ] || continue
              echo "| \`${wf}\` | ${field} | \`${cur}\` | \`${tgt}\` |"
            done
            echo
            echo "### How to fix"
            echo
            echo "Regenerating the locks is a manual, human-reviewed step (pushing changes under"
            echo "\`.github/workflows/\` needs a token with the \`workflows\` permission, which the"
            echo "built-in \`GITHUB_TOKEN\` lacks). Follow the **update-workflow-versions** skill:"
            echo
            echo "➡️ ${skill_url}"
            echo
            echo "<sub>Generated by \`.github/workflows/gh-aw-version-check.yml\`.</sub>"
          } > "$BODY"
          echo "Wrote issue body to $BODY"

      - name: Ensure tracking label exists
        if: ${{ steps.check.outputs.drift == 'true' }}
        run: |
          gh label create "$ISSUE_LABEL" \
            --repo "$REPO" \
            --color "b60205" \
            --description "Compiled workflow locks are pinned to an outdated version" \
            --force 2>/dev/null || true

      - name: Open or update drift issue
        if: ${{ steps.check.outputs.drift == 'true' }}
        env:
          BODY_FILE: ${{ runner.temp }}/version-drift.md
        run: |
          set -euo pipefail
          title="Workflow version drift: locks need regenerating"
          existing="$(gh issue list --repo "$REPO" --state open \
            --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" \
              --title "$title" --body-file "$BODY_FILE"
            echo "Updated tracking issue #$existing"
            echo "Updated tracking issue #$existing." >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --repo "$REPO" \
              --title "$title" --body-file "$BODY_FILE" --label "$ISSUE_LABEL")"
            echo "Opened tracking issue: $url"
            echo "Opened tracking issue: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close stale drift issue
        if: ${{ steps.check.outputs.drift == 'false' }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --state open \
            --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "All workflow locks are back in sync with their target versions. Closing automatically."
            echo "Closed stale tracking issue #$existing"
          fi
          echo "All workflow versions are up to date." >> "$GITHUB_STEP_SUMMARY"
