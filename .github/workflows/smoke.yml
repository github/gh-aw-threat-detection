name: Smoke

on:
  workflow_dispatch:
    inputs:
      include_latest:
        description: >-
          Also dispatch the three smoke-<engine>-standalone-latest workflows,
          which test the newest github/gh-aw-threat-detection release (not the
          version pinned by production gh-aw). Leave off for the reproducible,
          pinned smokes only.
        required: false
        default: false
        type: boolean
      detector_tag:
        description: >-
          Detector tag forwarded to the smoke-<engine>-standalone-latest
          workflows when include_latest is enabled. If empty, each workflow
          tests the newest github/gh-aw-threat-detection release.
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch smoke workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          workflows=(
            smoke-copilot-standalone.lock.yml
            smoke-claude-standalone.lock.yml
            smoke-codex-standalone.lock.yml
          )

          failures=()
          for workflow in "${workflows[@]}"; do
            if gh workflow run "$workflow" --repo "$REPO" --ref "$REF"; then
              echo "Dispatched $workflow"
            else
              echo "Failed to dispatch $workflow" >&2
              failures+=("$workflow")
            fi
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Failed to dispatch %d workflow(s):\n' "${#failures[@]}" >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi
      - name: Dispatch latest-release smokes
        if: ${{ inputs.include_latest }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DETECTOR_TAG: ${{ inputs.detector_tag }}
        run: |
          set -euo pipefail

          workflows=(
            smoke-copilot-standalone-latest.yml
            smoke-claude-standalone-latest.yml
            smoke-codex-standalone-latest.yml
          )

          failures=()
          for workflow in "${workflows[@]}"; do
            args=("$workflow" --repo "$REPO" --ref "$REF")
            if [ -n "${DETECTOR_TAG:-}" ]; then
              args+=(--field "detector_tag=${DETECTOR_TAG}")
            fi
            if gh workflow run "${args[@]}"; then
              if [ -n "${DETECTOR_TAG:-}" ]; then
                echo "Dispatched $workflow (detector_tag='${DETECTOR_TAG}')"
              else
                echo "Dispatched $workflow (detector_tag empty; tests newest release)"
              fi
            else
              echo "Failed to dispatch $workflow" >&2
              failures+=("$workflow")
            fi
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Failed to dispatch %d latest workflow(s):\n' "${#failures[@]}" >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi
