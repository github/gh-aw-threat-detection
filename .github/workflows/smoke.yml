name: Smoke

on:
  workflow_dispatch:
    inputs:
      include_latest:
        description: >-
          Also dispatch smoke-standalone-latest.yml, which recompiles the smoke
          workflows against the newest gh-aw + gh-aw-threat-detection
          prereleases and runs them under AWF. Leave off for the reproducible,
          pinned smokes only.
        required: false
        default: false
        type: boolean
      detector_ref:
        description: >-
          Detector ref forwarded to smoke-standalone-latest.yml when
          include_latest is enabled. If empty, that workflow tests the newest
          github/gh-aw-threat-detection prerelease.
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch smoke workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          workflows=(
            smoke-copilot-standalone.lock.yml
            smoke-claude-standalone.lock.yml
            smoke-codex-standalone.lock.yml
          )

          failures=()
          for workflow in "${workflows[@]}"; do
            if gh workflow run "$workflow" --repo "$REPO" --ref "$REF"; then
              echo "Dispatched $workflow"
            else
              echo "Failed to dispatch $workflow" >&2
              failures+=("$workflow")
            fi
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Failed to dispatch %d workflow(s):\n' "${#failures[@]}" >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi
      - name: Dispatch latest smoke meta-workflow
        if: ${{ inputs.include_latest }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DETECTOR_REF: ${{ inputs.detector_ref }}
        run: |
          set -euo pipefail
          args=(smoke-standalone-latest.yml --repo "$REPO" --ref "$REF")
          if [ -n "${DETECTOR_REF:-}" ]; then
            args+=(--field "detector_ref=${DETECTOR_REF}")
          fi
          gh workflow run "${args[@]}"
          if [ -n "${DETECTOR_REF:-}" ]; then
            echo "Dispatched smoke-standalone-latest.yml (detector_ref='${DETECTOR_REF}')"
          else
            echo "Dispatched smoke-standalone-latest.yml (detector_ref empty; tests newest prereleases)"
          fi
