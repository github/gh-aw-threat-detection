name: gh-aw Threat-Detection Issue Digest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: gh-aw-issue-digest
  cancel-in-progress: false

jobs:
  digest:
    if: ${{ github.repository == 'github/gh-aw-threat-detection' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fresh namespace intentionally establishes a baseline on the first run.
      - name: Restore digest state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/issue-digest-state
          key: issue-digest-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            issue-digest-v1-${{ github.repository }}-
      - name: Collect and publish digest without an agent
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_FILE: ${{ runner.temp }}/issue-digest-state/reported-issues.json
        run: python3 scripts/issue-digest.py --state-file "$STATE_FILE"
      - name: Save confirmed digest state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/issue-digest-state
          key: issue-digest-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
