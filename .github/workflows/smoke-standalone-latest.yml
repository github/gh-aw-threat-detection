name: Smoke Standalone Latest

# Full-fidelity smoke test of the LATEST github/gh-aw-threat-detection release
# through the REAL native gh-aw + AWF detection path.
#
# The scheduled `smoke-{copilot,claude,codex}-standalone` workflows run through
# production gh-aw, which hard-pins the `threat-detect` binary version as a
# compile-time Go constant (`constants.DefaultThreatDetectVersion`). That makes
# them faithful to production but unable to exercise a newer detector build.
#
# This meta-workflow closes that gap without hand-porting the AWF plumbing:
#
#   1. Resolve the latest prerelease of github/gh-aw and of
#      github/gh-aw-threat-detection (both overridable via inputs).
#   2. Clone gh-aw at that prerelease, patch DefaultThreatDetectVersion to the
#      resolved detector tag, and build the `gh-aw` compiler from source.
#   3. Recompile the three `smoke-<engine>-standalone.md` workflows with that
#      patched compiler (SHA-pinned action mode, matching the gh-aw prerelease).
#      The only thing that changes versus production is the detector version.
#   4. Push the recompiled `.lock.yml` files to a throwaway branch and dispatch
#      the real `smoke-<engine>-standalone.lock.yml` workflows on that branch —
#      so detection runs under AWF exactly as it would in production, but with
#      the newest detector binary.
#
# Because it drives the existing per-engine smoke workflows, each engine still
# runs as its own independent GitHub Actions run.
#
# Triggers:
#   * workflow_dispatch — manual, with optional ref/engine overrides.
#   * workflow_run       — automatically after the "Release" workflow finishes
#                          publishing a new (pre)release.

on:
  workflow_dispatch:
    inputs:
      gh_aw_ref:
        description: >-
          github/gh-aw ref (tag/branch/SHA) to build the compiler from. Leave
          empty to use the newest gh-aw prerelease.
        required: false
        default: ''
        type: string
      detector_ref:
        description: >-
          github/gh-aw-threat-detection release tag to test (e.g. main,
          v0.3.1). Leave empty to use the newest detector prerelease.
        required: false
        default: ''
        type: string
      engines:
        description: Which engine smoke(s) to dispatch.
        required: false
        default: all
        type: choice
        options:
          - all
          - copilot
          - claude
          - codex
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write
  actions: write

# Serialize runs so the throwaway-branch lifecycle does not race between runs.
concurrency:
  group: smoke-standalone-latest
  cancel-in-progress: false

jobs:
  compile-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For workflow_run triggers, only proceed when the Release workflow succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout detection repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve gh-aw and detector refs
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          INPUT_GH_AW_REF: ${{ inputs.gh_aw_ref }}
          INPUT_DETECTOR_REF: ${{ inputs.detector_ref }}
          # Tag of the detector release whose Release workflow just completed
          # (auto-run). Tag pushes often leave head_branch null, so this may be
          # empty, in which case we fall back to the newest prerelease.
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          newest_prerelease() {
            gh release list --repo "$1" --exclude-drafts --limit 50 \
              --json tagName,isPrerelease,publishedAt \
              --jq 'map(select(.isPrerelease)) | sort_by(.publishedAt) | last | .tagName'
          }

          gh_aw_ref="${INPUT_GH_AW_REF:-}"
          if [ -z "$gh_aw_ref" ]; then
            gh_aw_ref="$(newest_prerelease github/gh-aw)"
          fi

          detector_ref="${INPUT_DETECTOR_REF:-}"
          detector_source="workflow_dispatch input"
          if [ -z "$detector_ref" ] && [ "$EVENT" = "workflow_run" ] && [ -n "${RELEASE_TAG:-}" ]; then
            detector_ref="$RELEASE_TAG"
            detector_source="triggering Release run"
          fi
          if [ -z "$detector_ref" ]; then
            detector_ref="$(newest_prerelease github/gh-aw-threat-detection)"
            detector_source="newest detector prerelease"
          fi

          if [ -z "$gh_aw_ref" ] || [ "$gh_aw_ref" = "null" ]; then
            echo "::error::Could not resolve a github/gh-aw ref."
            exit 1
          fi
          if [ -z "$detector_ref" ] || [ "$detector_ref" = "null" ]; then
            echo "::error::Could not resolve a github/gh-aw-threat-detection ref."
            exit 1
          fi

          echo "gh_aw_ref=$gh_aw_ref" >> "$GITHUB_OUTPUT"
          echo "detector_ref=$detector_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved gh-aw ref '$gh_aw_ref', detector ref '$detector_ref' ($detector_source)"
          {
            echo "### Versions under test"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| gh-aw compiler ref | \`$gh_aw_ref\` |"
            echo "| Detector tag | \`$detector_ref\` (source: $detector_source) |"
            echo "| Trigger | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select engines
        id: engines
        env:
          # Auto-runs (workflow_run) always cover every engine.
          ENGINE: ${{ github.event_name == 'workflow_dispatch' && inputs.engines || 'all' }}
        run: |
          set -euo pipefail
          case "${ENGINE:-all}" in
            all|'') echo 'engines=copilot claude codex' >> "$GITHUB_OUTPUT" ;;
            copilot|claude|codex) echo "engines=${ENGINE}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown engine '${ENGINE}'"; exit 1 ;;
          esac

      - name: Clone and patch gh-aw
        env:
          GH_AW_REF: ${{ steps.refs.outputs.gh_aw_ref }}
          DETECTOR_REF: ${{ steps.refs.outputs.detector_ref }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/gh-aw-src"
          git clone --depth 1 --branch "$GH_AW_REF" https://github.com/github/gh-aw "${RUNNER_TEMP}/gh-aw-src"
          constFile="${RUNNER_TEMP}/gh-aw-src/pkg/constants/version_constants.go"
          if ! grep -q 'DefaultThreatDetectVersion Version =' "$constFile"; then
            echo "::error::DefaultThreatDetectVersion not found in $constFile (gh-aw layout changed?)"
            exit 1
          fi
          sed -i -E 's/(DefaultThreatDetectVersion Version = )"[^"]*"/\1"'"$DETECTOR_REF"'"/' "$constFile"
          echo "Patched detector version constant:"
          grep -n 'DefaultThreatDetectVersion Version =' "$constFile"

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: ${{ runner.temp }}/gh-aw-src/go.mod
          cache: false

      - name: Build patched gh-aw compiler
        env:
          GH_AW_REF: ${{ steps.refs.outputs.gh_aw_ref }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/gh-aw-src"
          go build -ldflags "-s -w -X main.version=${GH_AW_REF}" -o "${RUNNER_TEMP}/gh-aw-bin" ./cmd/gh-aw
          "${RUNNER_TEMP}/gh-aw-bin" version || true

      - name: Recompile smoke workflows against latest detector
        env:
          GH_AW_REF: ${{ steps.refs.outputs.gh_aw_ref }}
          ENGINES: ${{ steps.engines.outputs.engines }}
          GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          for engine in $ENGINES; do
            md=".github/workflows/smoke-${engine}-standalone.md"
            echo "Compiling $md ..."
            # Action mode + tag matches the gh-aw prerelease so the setup action
            # (github/gh-aw-actions) is SHA-pinned exactly as in production.
            "${RUNNER_TEMP}/gh-aw-bin" compile \
              --action-mode action \
              --action-tag "$GH_AW_REF" \
              --no-check-update \
              "$md"
          done
          echo "Recompiled lock files:"
          grep -n "install_threat_detect_binary.sh" .github/workflows/smoke-*-standalone.lock.yml || true

      - name: Push recompiled locks to throwaway branch
        id: branch
        env:
          ENGINES: ${{ steps.engines.outputs.engines }}
          GH_AW_REF: ${{ steps.refs.outputs.gh_aw_ref }}
          DETECTOR_REF: ${{ steps.refs.outputs.detector_ref }}
        run: |
          set -euo pipefail
          branch="smoke-latest/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Best-effort cleanup of stale throwaway branches from earlier runs.
          # Runs are serialized via concurrency, so prior child smokes have
          # normally finished by now.
          for stale in $(git ls-remote --heads origin 'smoke-latest/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            [ "$stale" = "$branch" ] && continue
            git push origin --delete "$stale" || echo "Could not delete stale branch $stale (continuing)"
          done

          git checkout -b "$branch"
          for engine in $ENGINES; do
            git add "-f" ".github/workflows/smoke-${engine}-standalone.lock.yml"
          done
          git commit --allow-empty -m "ci: recompile smoke locks (gh-aw ${GH_AW_REF}, detector ${DETECTOR_REF})"
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Pushed recompiled locks to branch $branch"

      - name: Dispatch per-engine smokes on throwaway branch
        env:
          ENGINES: ${{ steps.engines.outputs.engines }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          DETECTOR_REF: ${{ steps.refs.outputs.detector_ref }}
        run: |
          set -euo pipefail
          failures=()
          for engine in $ENGINES; do
            wf="smoke-${engine}-standalone.lock.yml"
            if gh workflow run "$wf" --repo "$REPO" --ref "$BRANCH"; then
              echo "Dispatched $wf on $BRANCH (detector $DETECTOR_REF)"
            else
              echo "Failed to dispatch $wf" >&2
              failures+=("$wf")
            fi
          done
          {
            echo ""
            echo "### Dispatched smokes"
            echo ""
            echo "Branch: \`${BRANCH}\`"
            echo ""
            for engine in $ENGINES; do
              echo "- [$engine](${{ github.server_url }}/${REPO}/actions/workflows/smoke-${engine}-standalone.lock.yml)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Failed to dispatch %d workflow(s):\n' "${#failures[@]}" >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi
